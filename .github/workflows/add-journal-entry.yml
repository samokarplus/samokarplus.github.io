name: Add Journal Entry

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Journal date, like 06-01-26"
        required: true
        type: string
      text:
        description: "Paste the full journal entry text here"
        required: true
        type: string

permissions:
  contents: write

jobs:
  add-journal-entry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add journal entry
        env:
          JOURNAL_DATE: ${{ inputs.date }}
          JOURNAL_TEXT: ${{ inputs.text }}
        run: python3 scripts/add-journal-entry.py

      - name: Commit and push journal entry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal-data.js index.html

          if git diff --cached --quiet; then
            echo "No journal changes to commit."
            exit 0
          fi

          git commit -m "Add journal entry"
          git pull --rebase origin main
          git push origin HEAD:main
