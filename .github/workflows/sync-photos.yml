name: Sync Photo Carousels

# Upload a picture into assets/images/baby, older or couple: it gets shrunk if huge and joins that carousel.
on:
  push:
    branches: [main]
    paths:
      - "assets/images/baby/**"
      - "assets/images/older/**"
      - "assets/images/couple/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install image tools
        run: pip install pillow
      - run: python3 scripts/sync-photos.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to update."
            exit 0
          fi
          git commit -m "Update photo carousels"
          git pull --rebase origin main
          git push origin HEAD:main
