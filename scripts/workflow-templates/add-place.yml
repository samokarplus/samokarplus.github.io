name: Add Place

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "What is it?"
        required: true
        type: choice
        options:
          - country
          - US state
      name:
        description: "Name, like Japan or Oregon"
        required: true
        type: string

permissions:
  contents: write

jobs:
  add-place:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add place
        env:
          PLACE_KIND: ${{ inputs.kind }}
          PLACE_NAME: ${{ inputs.name }}
        run: python3 scripts/add-place.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add places-data.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add place: ${{ inputs.name }}"
          git pull --rebase origin main
          git push origin HEAD:main
